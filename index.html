<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<link rel="manifest" href="manifest.json">

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  color:white;
}
.header{
  padding:15px;
  display:flex;
  justify-content:space-between;
}
.container{padding:15px;}
.card{
  background:white;
  color:black;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4f46e5;
  color:white;
}
.hidden{display:none}
.progress{height:6px;background:#ddd;border-radius:10px}
.bar{height:6px;background:#10b981;border-radius:10px}
.nav{
 position:fixed;bottom:0;width:100%;
 display:flex;justify-content:space-around;
 background:white;color:#4f46e5;
}
</style>
</head>

<body>

<div class="header">
  <div>🎓 UniSmart</div>
  <div id="user"></div>
</div>

<div class="container">

<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<div id="home" class="hidden">

<div class="card">
<h3>🚀 Avvia</h3>
<button onclick="start()">Simulazione</button>
<button onclick="generaAI()">🤖 Quiz AI</button>
</div>

<div class="card">
<h3>🏆 Classifica</h3>
<div id="rank"></div>
</div>

<div class="card">
<h3>💎 Premium</h3>
<div id="paypal-button-container"></div>
</div>

</div>

<div id="quizBox" class="card hidden">
<div id="timer"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h3 id="domanda"></h3>
<div id="opzioni"></div>
</div>

</div>

<div class="nav">
<button onclick="homeView()">Home</button>
<button onclick="start()">Quiz</button>
<button onclick="logout()">Logout</button>
</div>

<script>

// FIREBASE
firebase.initializeApp({
 apiKey:"AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
 authDomain:"uniai-4726b.firebaseapp.com",
 projectId:"uniai-4726b"
});

const auth=firebase.auth();
const db=firebase.firestore();
const analytics=firebase.analytics();

// LOGIN
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value)
}
function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
}
function logout(){auth.signOut()}

// SESSIONE
let premium=false;

auth.onAuthStateChanged(u=>{
 if(u){
  loginBox.classList.add("hidden");
  home.classList.remove("hidden");
  user.innerText=u.email;

  db.collection("users").doc(u.uid).get().then(d=>{
    if(d.exists && d.data().premium) premium=true;
  });

  loadRank();
 }else{
  loginBox.classList.remove("hidden");
 }
});

// QUIZ
let quiz=[{
 domanda:"Il PIL misura?",
 opzioni:["Produzione","Costo","Prezzo","Debito"],
 corretta:0
}];

let i=0;
let punteggio=0;

function start(){
 quizBox.classList.remove("hidden");
 home.classList.add("hidden");
 i=0; punteggio=0;
 next();
 analytics.logEvent("quiz_start");
}

function next(){
 if(i>=10 && !premium){
  quizBox.innerHTML="<h3>Premium richiesto</h3>";
  return;
 }
 if(i>=quiz.length){
  salvaScore();
  quizBox.innerHTML="<h3>Fine "+punteggio+"</h3>";
  analytics.logEvent("quiz_complete",{score:punteggio});
  return;
 }

 let q=quiz[i];
 domanda.innerText=q.domanda;

 let html="";
 q.opzioni.forEach((o,idx)=>{
  html+=`<button onclick="ans(${idx})">${o}</button>`;
 });
 opzioni.innerHTML=html;

 bar.style.width=((i+1)/quiz.length*100)+"%";
}

function ans(x){
 if(x===quiz[i].corretta) punteggio++;
 i++; next();
}

// SALVA CLASSIFICA
function salvaScore(){
 let u=auth.currentUser;
 if(!u) return;

 db.collection("leaderboard").doc(u.uid).set({
  email:u.email,
  punti:firebase.firestore.FieldValue.increment(punteggio)
 },{merge:true});
}

// LOAD CLASSIFICA
function loadRank(){
 db.collection("leaderboard")
 .orderBy("punti","desc")
 .limit(10)
 .get()
 .then(s=>{
  let h="";
  let p=1;
  s.forEach(d=>{
    let u=d.data();
    h+=`<p>${p}. ${u.email} - ${u.punti}</p>`;
    p++;
  });
  rank.innerHTML=h;
 });
}

// AI (semplice demo)
function generaAI(){
 quiz.push({
  domanda:"Domanda generata AI",
  opzioni:["A","B","C","D"],
  corretta:0
 });
 alert("Quiz AI aggiunto");
}

// VIEW
function homeView(){
 quizBox.classList.add("hidden");
 home.classList.remove("hidden");
}

// PWA
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("sw.js");
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({
  plan_id:'P-89F40211XT761711BNH4KATA'
 }),
 onApprove:(d,a)=>{
  localStorage.setItem("premium","true");
  alert("Premium attivo");
 }
}).render('#paypal-button-container');
</script>

</body>
</html>
