<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  color:white;
  text-align:center;
}
.card{
  background:white;
  color:black;
  border-radius:15px;
  padding:20px;
  margin:20px auto;
  width:90%;
  max-width:400px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4f46e5;
  color:white;
}
.hidden{display:none}
</style>
</head>

<body>

<h2>🎓 UniSmart AI</h2>

<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<div id="home" class="card hidden">
<h3 id="user"></h3>

<button onclick="start()">🎯 Inizia Quiz</button>

<h4>💎 Premium 7€/mese</h4>
<div id="paypal-button-container"></div>

<button onclick="logout()">Logout</button>
</div>

<div id="quizBox" class="card hidden"></div>

<script>

// 🔥 CONFIG CORRETTA (LA TUA)
firebase.initializeApp({
  apiKey: "AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
  authDomain: "uniai-4726b.firebaseapp.com",
  projectId: "uniai-4726b",
  appId: "1:272196411633:web:43095d8b2217a23ad68950"
});

const auth = firebase.auth();

// LOGIN
function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  ).catch(e => alert(e.message));
}

// REGISTRAZIONE
function register(){
  auth.createUserWithEmailAndPassword(
    document.getElementById("email").value,
    document.getElementById("password").value
  ).then(() => {
    alert("Account creato!");
  }).catch(e => alert(e.message));
}

// LOGOUT
function logout(){
  auth.signOut();
}

// SESSIONE
auth.onAuthStateChanged(user=>{
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("user").innerText = user.email;
  }else{
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("home").classList.add("hidden");
  }
});

// QUIZ
let quiz = [
 {domanda:"Il PIL misura?",opzioni:["Produzione","Costo","Prezzo","Debito"],corretta:0},
 {domanda:"Cos'è un tributo?",opzioni:["Entrata pubblica","Spesa","Debito","Credito"],corretta:0},
 {domanda:"Chi paga l'IRPEF?",opzioni:["Persone fisiche","Imprese","Stato","Banche"],corretta:0}
];

let index = 0;

// START QUIZ
function start(){
  document.getElementById("quizBox").classList.remove("hidden");
  document.getElementById("home").classList.add("hidden");
  index = 0;
  mostra();
}

// MOSTRA DOMANDA
function mostra(){

  if(index >= 10 && !localStorage.getItem("premium")){
    document.getElementById("quizBox").innerHTML = "<h3>🔒 Passa a Premium</h3>";
    return;
  }

  if(index >= quiz.length){
    document.getElementById("quizBox").innerHTML = "<h3>Fine quiz</h3>";
    return;
  }

  let q = quiz[index];

  let html = "<h3>"+q.domanda+"</h3>";

  q.opzioni.forEach((o,i)=>{
    html += "<button onclick='rispondi("+i+")'>"+o+"</button>";
  });

  document.getElementById("quizBox").innerHTML = html;
}

// RISPOSTA
function rispondi(i){
  index++;
  mostra();
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
  createSubscription:(data,actions)=>actions.subscription.create({
    plan_id:'P-89F40211XT761711BNH4KATA'
  }),
  onApprove:()=>{
    localStorage.setItem("premium","true");
    alert("✅ Premium attivo!");
  }
}).render('#paypal-button-container');
</script>

</body>
</html>
