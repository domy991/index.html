<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #4f46e5, #9333ea);
  margin: 0;
  color: white;
}

.header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  color: black;
  border-radius: 15px;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #4f46e5;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #3730a3;
}

.hidden { display:none; }

.progress {
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  margin-bottom: 10px;
}

.bar {
  height: 10px;
  background: green;
  border-radius: 10px;
}
</style>

</head>

<body>

<div class="header">🎓 UniSmart AI</div>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>Login</h3>
  <input id="username" placeholder="Inserisci nome" style="width:100%;padding:10px;">
  <button onclick="login()">Entra</button>
</div>

<!-- HOME -->
<div id="home" class="card hidden">
  <h2>Benvenuto <span id="user"></span></h2>

  <button onclick="startSimulazione()">🎯 Simulazione Esame</button>
  <button onclick="mostraErrori()">❌ I tuoi errori</button>
  <button onclick="ripasso()">🧠 Ripasso intelligente</button>
  <button onclick="vaiPagamento()">💰 Sblocca Premium</button>
</div>

<!-- QUIZ -->
<div id="quizBox" class="card hidden">
  <div id="timer"></div>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <h3 id="domanda"></h3>
  <div id="opzioni"></div>
</div>

</div>

<script>

// ===== LOGIN =====
function login(){
  let user = document.getElementById("username").value;
  localStorage.setItem("user", user);

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");

  document.getElementById("user").innerText = user;
}

if(localStorage.getItem("user")){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("user").innerText = localStorage.getItem("user");
}

// ===== DATI =====
let quizData = [];
let quizFiltrati = [];
let errori = JSON.parse(localStorage.getItem("errori") || "[]");

let index = 0;
let punteggio = 0;

let tempo = 2700;
let timerInterval;

let limiteFree = 10;

// ===== LOAD QUIZ =====
fetch("quiz.json")
  .then(res => res.json())
  .then(data => quizData = data);

// ===== SIMULAZIONE =====
function startSimulazione(){

  quizFiltrati = quizData.sort(()=>0.5-Math.random()).slice(0,30);

  index = 0;
  punteggio = 0;
  tempo = 2700;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  avviaTimer();
  mostra();
}

// ===== TIMER =====
function avviaTimer(){
  aggiornaTimer();

  timerInterval = setInterval(()=>{
    tempo--;
    aggiornaTimer();

    if(tempo <= 0){
      fine();
    }
  },1000);
}

function aggiornaTimer(){
  let min = Math.floor(tempo/60);
  let sec = tempo%60;
  document.getElementById("timer").innerText = "⏱️ "+min+":"+(sec<10?"0":"")+sec;
}

// ===== DOMANDA =====
function mostra(){

  if(index >= limiteFree && !localStorage.getItem("premium")){
    document.getElementById("quizBox").innerHTML = `
      <h2>🔒 Premium</h2>
      <p>Hai raggiunto il limite gratuito</p>
      <button onclick="vaiPagamento()">Sblocca a 7€/mese</button>
    `;
    return;
  }

  let q = quizFiltrati[index];

  document.getElementById("domanda").innerText = q.domanda;

  let html = "";

  q.opzioni.forEach((op,i)=>{
    html += `<button onclick="rispondi(${i})">${op}</button>`;
  });

  document.getElementById("opzioni").innerHTML = html;

  document.getElementById("bar").style.width =
    ((index+1)/quizFiltrati.length)*100 + "%";
}

// ===== RISPOSTA =====
function rispondi(i){
  let q = quizFiltrati[index];

  if(i === q.corretta){
    punteggio++;
  } else {
    errori.push(q);
    localStorage.setItem("errori", JSON.stringify(errori));
  }

  index++;

  if(index >= quizFiltrati.length){
    fine();
  } else {
    mostra();
  }
}

// ===== FINE =====
function fine(){
  clearInterval(timerInterval);

  document.getElementById("quizBox").innerHTML = `
    <h2>Risultato</h2>
    <p>${punteggio}/${quizFiltrati.length}</p>
    <button onclick="location.reload()">Home</button>
  `;
}

// ===== ERRORI =====
function mostraErrori(){

  if(errori.length === 0){
    alert("Nessun errore salvato");
    return;
  }

  quizFiltrati = errori;
  index = 0;
  punteggio = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  mostra();
}

// ===== RIPASSO =====
function ripasso(){

  if(errori.length === 0){
    alert("Nessun errore");
    return;
  }

  quizFiltrati = errori.sort(()=>0.5-Math.random()).slice(0,20);

  index = 0;
  punteggio = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  mostra();
}

// ===== PAGAMENTO =====
function vaiPagamento(){
  window.location.href = "https://buy.stripe.com/XXXXX";
}

// TEST SBLOCCO
// localStorage.setItem("premium","true");

</script>

</body>
</html>
