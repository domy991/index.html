<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UniSmart AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#4f46e5,#9333ea);color:white;text-align:center}
.card{background:white;color:black;border-radius:15px;padding:20px;margin:15px auto;width:90%;max-width:450px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;background:#4f46e5;color:white;font-size:15px}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:6px;background:#ddd;border-radius:10px;margin:10px 0}
.bar{height:6px;background:#10b981;border-radius:10px}
.timer{font-weight:bold;margin-bottom:10px}
</style>
</head>

<body>

<h2>🎓 UniSmart AI</h2>

<!-- LOGIN -->
<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">

<div class="card">
<h3 id="user"></h3>

<h3>📚 Materie</h3>
<div class="grid">
<button onclick="startMateria('amm')">⚖️ Amm.</button>
<button onclick="startMateria('cost')">📜 Cost.</button>
<button onclick="startMateria('eco')">📊 Eco</button>
<button onclick="startMateria('trib')">💰 Trib.</button>
</div>

<button onclick="simulazione()">🎯 Simulazione Esame</button>
<button onclick="mostraErrori()">❌ Errori</button>
<button onclick="ripasso()">🧠 Ripasso</button>

<h4>💎 Premium</h4>
<div id="paypal-button-container"></div>

<button onclick="logout()">Logout</button>

</div>

<div class="card">
<h3>🏆 Classifica</h3>
<div id="rank"></div>
</div>

</div>

<!-- QUIZ -->
<div id="quizBox" class="card hidden">
<div id="timer" class="timer"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h3 id="domanda"></h3>
<div id="opzioni"></div>
</div>

<script>

// FIREBASE
firebase.initializeApp({
 apiKey:"AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
 authDomain:"uniai-4726b.firebaseapp.com",
 projectId:"uniai-4726b"
});

const auth = firebase.auth();
const db = firebase.firestore();

// LOGIN
function login(){
 let e=email.value.trim(), p=password.value;
 if(!e.includes("@")) return alert("Email non valida");
 auth.signInWithEmailAndPassword(e,p).catch(err=>alert(err.message));
}
function register(){
 let e=email.value.trim(), p=password.value;
 if(!e.includes("@")) return alert("Email non valida");
 auth.createUserWithEmailAndPassword(e,p).then(()=>alert("Account creato"))
 .catch(err=>alert(err.message));
}
function logout(){auth.signOut();}

// SESSIONE
auth.onAuthStateChanged(u=>{
 if(u){
  loginBox.classList.add("hidden");
  home.classList.remove("hidden");
  user.innerText=u.email;
  caricaClassifica();
 }else{
  loginBox.classList.remove("hidden");
  home.classList.add("hidden");
 }
});

// DATABASE QUIZ
let DB = {
amm:[
{domanda:"La legge 241/1990 riguarda:",opzioni:["Procedimento amministrativo","Penale","Civile","Costituzione"],corretta:0},
{domanda:"Il silenzio assenso è:",opzioni:["Accoglimento","Rigetto","Sanzione","Nullità"],corretta:0}
],
cost:[
{domanda:"La Costituzione entra in vigore:",opzioni:["1948","1861","1922","2001"],corretta:0},
{domanda:"Il Parlamento è:",opzioni:["Camera e Senato","Solo Camera","Governo","Corte"],corretta:0}
],
eco:[
{domanda:"Il PIL misura:",opzioni:["Produzione","Debito","Inflazione","Reddito"],corretta:0},
{domanda:"Il deficit è:",opzioni:["Spesa>Entrate","Entrate>Spesa","Zero","Debito"],corretta:0}
],
trib:[
{domanda:"IRPEF è:",opzioni:["Diretta","Indiretta","Locale","Comunale"],corretta:0},
{domanda:"IVA è:",opzioni:["Indiretta","Diretta","Regionale","Statale"],corretta:0}
]
};

// STATO
let quiz=[], index=0, punti=0, tempo=2700;
let errori = JSON.parse(localStorage.getItem("errori")||"[]");

// AVVIO MATERIA
function startMateria(m){
 quiz = DB[m].sort(()=>0.5-Math.random());
 avvia();
}

// SIMULAZIONE
function simulazione(){
 quiz = [].concat(...Object.values(DB)).sort(()=>0.5-Math.random()).slice(0,30);
 avvia();
}

// AVVIO
function avvia(){
 index=0; punti=0; tempo=2700;
 quizBox.classList.remove("hidden");
 home.classList.add("hidden");
 timerStart();
 mostra();
}

// TIMER
let t;
function timerStart(){
 clearInterval(t);
 t=setInterval(()=>{
  tempo--;
  let m=Math.floor(tempo/60), s=tempo%60;
  timer.innerText="⏱ "+m+":"+(s<10?"0":"")+s;
  if(tempo<=0) fine();
 },1000);
}

// MOSTRA
function mostra(){

 if(index>=10 && !localStorage.getItem("premium")){
  quizBox.innerHTML="<h3>🔒 Premium richiesto</h3>";
  return;
 }

 if(index>=quiz.length){
  fine();
  return;
 }

 let q=quiz[index];
 domanda.innerText=q.domanda;

 let html="";
 q.opzioni.forEach((o,i)=>{
  html+=`<button onclick="rispondi(${i})">${o}</button>`;
 });
 opzioni.innerHTML=html;

 bar.style.width=((index+1)/quiz.length*100)+"%";
}

// RISPOSTA
function rispondi(i){
 let q=quiz[index];
 if(i===q.corretta) punti++;
 else{
  errori.push(q);
  localStorage.setItem("errori",JSON.stringify(errori));
 }
 index++;
 mostra();
}

// FINE
function fine(){
 clearInterval(t);
 salvaScore();
 quizBox.innerHTML=`<h3>Risultato ${punti}/${quiz.length}</h3><button onclick="location.reload()">Home</button>`;
}

// ERRORI
function mostraErrori(){
 if(errori.length==0) return alert("Nessun errore");
 quiz=errori; avvia();
}

// RIPASSO
function ripasso(){
 if(errori.length==0) return alert("Nessun errore");
 quiz=errori.sort(()=>0.5-Math.random()).slice(0,20);
 avvia();
}

// CLASSIFICA
function salvaScore(){
 let u=auth.currentUser;
 if(!u) return;
 db.collection("leaderboard").doc(u.uid).set({
  email:u.email,
  punti:firebase.firestore.FieldValue.increment(punti)
 },{merge:true});
}

function caricaClassifica(){
 db.collection("leaderboard").orderBy("punti","desc").limit(10).get()
 .then(s=>{
  let html="",pos=1;
  s.forEach(d=>{
    let u=d.data();
    html+=`<p>${pos}. ${u.email} - ${u.punti}</p>`;
    pos++;
  });
  rank.innerHTML=html;
 });
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({
  plan_id:'P-89F40211XT761711BNH4KATA'
 }),
 onApprove:()=>{
  localStorage.setItem("premium","true");
  alert("Premium attivo!");
 }
}).render('#paypal-button-container');
</script>

</body>
</html>
