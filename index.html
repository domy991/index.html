<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UniSmart AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#4f46e5,#9333ea);color:white;text-align:center}
.card{background:white;color:black;border-radius:15px;padding:20px;margin:15px auto;width:90%;max-width:450px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;background:#4f46e5;color:white}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:6px;background:#ddd;border-radius:10px;margin:10px 0}
.bar{height:6px;background:#10b981;border-radius:10px}
</style>
</head>

<body>

<h2>🎓 UniSmart AI</h2>

<!-- LOGIN -->
<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">

<div class="card">
<h3 id="user"></h3>

<h3>📚 Materie</h3>
<div id="materieBox" class="grid"></div>

<button onclick="simulazione()">🎯 Simulazione Esame</button>
<button onclick="mostraErrori()">❌ Errori</button>
<button onclick="ripasso()">🧠 Ripasso</button>

<h4>💎 Premium</h4>
<div id="paypal-button-container"></div>

<button onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="card hidden">
<h3>⚙️ Admin Panel</h3>
<button onclick="resetClassifica()">Reset classifica</button>
<button onclick="contaUtenti()">👥 Utenti</button>
<button onclick="contaPremium()">💎 Premium</button>
<div id="adminStats"></div>
</div>

<!-- CLASSIFICA -->
<div class="card">
<h3>🏆 Classifica</h3>
<div id="rank"></div>
</div>

</div>

<!-- QUIZ -->
<div id="quizBox" class="card hidden">
<div class="progress"><div id="bar" class="bar"></div></div>
<h3 id="domanda"></h3>
<div id="opzioni"></div>
</div>

<script>

// ===== CONFIG =====
const ADMIN_EMAIL = "domenicosenza@gmail.com";

const nomiMaterie = {
  amm: "⚖️ Diritto Amministrativo",
  cost: "📜 Costituzionale",
  eco: "📊 Economia",
  trib: "💰 Tributario",
  civile: "📚 Civile",
  penale: "🏛️ Penale"
};

// ===== FIREBASE =====
firebase.initializeApp({
 apiKey:"AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
 authDomain:"uniai-4726b.firebaseapp.com",
 projectId:"uniai-4726b"
});

const auth = firebase.auth();
const db = firebase.firestore();

// ===== LOGIN =====
function login(){
 auth.signInWithEmailAndPassword(email.value.trim(),password.value)
 .catch(e=>alert(e.message));
}
function register(){
 auth.createUserWithEmailAndPassword(email.value.trim(),password.value)
 .catch(e=>alert(e.message));
}
function logout(){auth.signOut();}

// ===== SESSIONE =====
auth.onAuthStateChanged(u=>{
 if(u){
  loginBox.classList.add("hidden");
  home.classList.remove("hidden");
  user.innerText=u.email;

  if(u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
    adminBox.classList.remove("hidden");
  }

  caricaClassifica();
 }else{
  loginBox.classList.remove("hidden");
  home.classList.add("hidden");
 }
});

// ===== CARICA QUIZ =====
let DB = {};
let quizCaricati = false;

fetch("quiz.json")
.then(res => res.json())
.then(data => {
 DB = data;
 quizCaricati = true;
 generaMaterie();
});

// ===== GENERA MATERIE =====
function generaMaterie(){
 let html = "";

 Object.keys(DB).forEach(m => {
  let nome = nomiMaterie[m] || m.toUpperCase();

  html += `
    <button onclick="startMateria('${m}')">
      ${nome} (${DB[m].length})
    </button>
  `;
 });

 materieBox.innerHTML = html;
}

// ===== STATO =====
let quiz = [];
let index = 0;
let punti = 0;
let errori = JSON.parse(localStorage.getItem("errori") || "[]");

// ===== AVVIO =====
function startMateria(m){
 if(!quizCaricati) return alert("Caricamento...");
 quiz = DB[m].sort(()=>0.5-Math.random());
 avvia();
}

function simulazione(){
 if(!quizCaricati) return alert("Caricamento...");
 quiz = Object.values(DB).flat().sort(()=>0.5-Math.random()).slice(0,30);
 avvia();
}

function avvia(){
 index=0;
 punti=0;
 quizBox.classList.remove("hidden");
 home.classList.add("hidden");
 mostra();
}

// ===== QUIZ =====
function mostra(){
 if(index>=quiz.length) return fine();

 let q = quiz[index];
 domanda.innerText = q.domanda;

 let html = "";
 q.opzioni.forEach((o,i)=>{
  html += `<button onclick="rispondi(${i})">${o}</button>`;
 });

 opzioni.innerHTML = html;
 bar.style.width = ((index+1)/quiz.length*100)+"%";
}

function rispondi(i){
 let q = quiz[index];

 if(i===q.corretta) punti++;
 else{
  errori.push(q);
  localStorage.setItem("errori",JSON.stringify(errori));
 }

 index++;
 mostra();
}

function fine(){
 salvaScore();

 quizBox.innerHTML = `
  <h3>Risultato ${punti}/${quiz.length}</h3>
  <button onclick="location.reload()">Home</button>
 `;
}

// ===== ERRORI =====
function mostraErrori(){
 if(errori.length===0) return alert("Nessun errore");
 quiz=errori;
 avvia();
}

// ===== RIPASSO =====
function ripasso(){
 if(errori.length===0) return alert("Nessun errore");
 quiz=errori.sort(()=>0.5-Math.random()).slice(0,20);
 avvia();
}

// ===== CLASSIFICA =====
function salvaScore(){
 let u = auth.currentUser;
 if(!u) return;

 db.collection("leaderboard").doc(u.uid).set({
  email:u.email,
  punti:firebase.firestore.FieldValue.increment(punti)
 },{merge:true});
}

function caricaClassifica(){
 db.collection("leaderboard")
 .orderBy("punti","desc")
 .limit(10)
 .get()
 .then(s=>{
  let html="",pos=1;

  s.forEach(d=>{
   let u=d.data();
   html+=`<p>${pos}. ${u.email} - ${u.punti}</p>`;
   pos++;
  });

  rank.innerHTML = html;
 });
}

// ===== ADMIN =====
function resetClassifica(){
 db.collection("leaderboard").get().then(s=>{
  s.forEach(doc=>doc.ref.delete());
 });
 alert("Classifica resettata");
}

function contaUtenti(){
 db.collection("leaderboard").get().then(s=>{
  adminStats.innerHTML = "Utenti: "+s.size;
 });
}

function contaPremium(){
 let c=0;
 db.collection("leaderboard").get().then(s=>{
  s.forEach(d=>{
   if(d.data().premium) c++;
  });
  adminStats.innerHTML = "Premium: "+c;
 });
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({
  plan_id:'P-89F40211XT761711BNH4KATA'
 }),
 onApprove:()=>{
  localStorage.setItem("premium","true");
  alert("Premium attivo!");
 }
}).render('#paypal-button-container');
</script>

</body>
</html>
