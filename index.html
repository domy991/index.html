<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:linear-gradient(135deg,#4f46e5,#9333ea);
  color:white;
  text-align:center;
}
.card{
  background:white;
  color:black;
  border-radius:15px;
  padding:20px;
  margin:20px auto;
  width:90%;
  max-width:400px;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#4f46e5;
  color:white;
}
.hidden{display:none}
</style>
</head>

<body>

<h2>🎓 UniSmart AI</h2>

<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<div id="home" class="card hidden">
<h3 id="user"></h3>

<button onclick="start()">🎯 Inizia Quiz</button>

<h4>💎 Premium 7€/mese</h4>
<div id="paypal-button-container"></div>
</div>

<div id="quizBox" class="card hidden"></div>

<script>

// FIREBASE
firebase.initializeApp({
 apiKey:"AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
 authDomain:"uniai-4726b.firebaseapp.com"
});

const auth=firebase.auth();

// LOGIN
function login(){
 auth.signInWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message))
}
function register(){
 auth.createUserWithEmailAndPassword(email.value,password.value)
 .catch(e=>alert(e.message))
}

// SESSIONE
auth.onAuthStateChanged(u=>{
 if(u){
  loginBox.classList.add("hidden")
  home.classList.remove("hidden")
  user.innerText=u.email
 }else{
  loginBox.classList.remove("hidden")
 }
})

// QUIZ BASE
let quiz=[
 {domanda:"Il PIL misura?",opzioni:["Produzione","Costo","Prezzo","Debito"],corretta:0},
 {domanda:"Cos'è un tributo?",opzioni:["Entrata pubblica","Spesa","Debito","Credito"],corretta:0},
 {domanda:"Chi paga l'IRPEF?",opzioni:["Persone fisiche","Imprese","Stato","Banche"],corretta:0}
];

let i=0;

function start(){
 quizBox.classList.remove("hidden")
 home.classList.add("hidden")
 i=0
 next()
}

function next(){

 if(i>=10 && !localStorage.getItem("premium")){
  quizBox.innerHTML="<h3>🔒 Passa a Premium</h3>"
  return
 }

 if(i>=quiz.length){
  quizBox.innerHTML="<h3>Fine quiz</h3>"
  return
 }

 let q=quiz[i]

 let html=`<h3>${q.domanda}</h3>`

 q.opzioni.forEach((o,idx)=>{
  html+=`<button onclick="ans(${idx})">${o}</button>`
 })

 quizBox.innerHTML=html
}

function ans(x){
 i++
 next()
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({
  plan_id:'P-89F40211XT761711BNH4KATA'
 }),
 onApprove:()=>{
  localStorage.setItem("premium","true")
  alert("✅ Premium attivo!")
 }
}).render('#paypal-button-container')
</script>

</body>
</html>
