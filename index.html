<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #4f46e5, #9333ea);
  margin: 0;
  color: white;
}

.header {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  color: black;
  border-radius: 15px;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #4f46e5;
  color: white;
  cursor: pointer;
  font-size: 16px;
}

button:hover {
  background: #3730a3;
}

.progress {
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  margin-bottom: 15px;
}

.bar {
  height: 10px;
  background: green;
  border-radius: 10px;
}

.hidden {
  display: none;
}
</style>

</head>

<body>

<div class="header">🎓 UniSmart AI</div>

<div class="container">

  <!-- HOME -->
  <div id="home" class="card">
    <h2>Seleziona materia</h2>

    <button onclick="start('diritto')">Diritto</button>
    <button onclick="start('economia')">Economia</button>
    <button onclick="start('lavoro')">Diritto del Lavoro</button>
  </div>

  <!-- QUIZ -->
  <div id="quizBox" class="card hidden">
    <div class="progress">
      <div id="bar" class="bar"></div>
    </div>

    <h3 id="domanda"></h3>
    <div id="opzioni"></div>
  </div>

</div>

<script>

const quizData = {
  diritto: [
    {
      domanda: "Chi avvia il processo?",
      opzioni: ["Giudice","Convenuto","Attore","PM"],
      corretta: 2,
      spiegazione: "L’attore avvia il processo"
    },
    {
      domanda: "La legge è?",
      opzioni: ["Facoltativa","Obbligatoria","Privata","Contratto"],
      corretta: 1,
      spiegazione: "La legge è obbligatoria"
    }
  ],

  economia: [
    {
      domanda: "Il PIL misura?",
      opzioni: ["Tasse","Produzione","Salari","Import"],
      corretta: 1,
      spiegazione: "Il PIL misura produzione"
    }
  ],

  lavoro: [
    {
      domanda: "NASpI è?",
      opzioni: ["Contratto","Sussidio","Licenza","Tributo"],
      corretta: 1,
      spiegazione: "È un sussidio di disoccupazione"
    }
  ]
};

let materia = "";
let index = 0;
let punteggio = 0;

function start(m){
  materia = m;
  index = 0;
  punteggio = 0;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  mostra();
}

function mostra(){
  const q = quizData[materia][index];

  document.getElementById("domanda").innerText = q.domanda;

  let html = "";

  q.opzioni.forEach((op, i) => {
    html += `<button onclick="rispondi(${i})">${op}</button>`;
  });

  document.getElementById("opzioni").innerHTML = html;

  let progress = ((index+1)/quizData[materia].length)*100;
  document.getElementById("bar").style.width = progress + "%";
}

function rispondi(i){
  const q = quizData[materia][index];

  if(i === q.corretta){
    punteggio++;
    alert("✔️ Corretto!\n\n" + q.spiegazione);
  } else {
    alert("❌ Sbagliato!\n\n" + q.spiegazione);
  }

  index++;

  if(index >= quizData[materia].length){
    alert("Fine quiz 🎉\nPunteggio: " + punteggio);
    location.reload();
  } else {
    mostra();
  }
}

</script>

</body>
</html>
