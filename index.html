<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>UniSmart AI</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#4f46e5,#9333ea);color:white;text-align:center}
.card{background:white;color:black;border-radius:15px;padding:20px;margin:15px auto;width:90%;max-width:450px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;background:#4f46e5;color:white}
.hidden{display:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.progress{height:6px;background:#ddd;border-radius:10px;margin:10px 0}
.bar{height:6px;background:#10b981;border-radius:10px}
</style>
</head>

<body>

<h2>🎓 UniSmart AI</h2>

<div id="loginBox" class="card">
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>
</div>

<div id="home" class="hidden">

<div class="card">
<h3 id="user"></h3>

<h3>📚 Materie</h3>
<div class="grid">
<button onclick="startMateria('amm')">⚖️ Amm.</button>
<button onclick="startMateria('cost')">📜 Cost.</button>
<button onclick="startMateria('eco')">📊 Eco</button>
<button onclick="startMateria('trib')">💰 Trib.</button>
</div>

<button onclick="simulazione()">🎯 Simulazione</button>
<button onclick="mostraErrori()">❌ Errori</button>
<button onclick="ripasso()">🧠 Ripasso</button>

<h4>💎 Premium</h4>
<div id="paypal-button-container"></div>

<button onclick="logout()">Logout</button>
</div>

<!-- ADMIN -->
<div id="adminBox" class="card hidden">
<h3>⚙️ Admin Panel</h3>
<button onclick="resetClassifica()">Reset classifica</button>
<button onclick="aggiungiQuiz()">Aggiungi quiz rapido</button>
</div>

<div class="card">
<h3>🏆 Classifica</h3>
<div id="rank"></div>
</div>

</div>

<div id="quizBox" class="card hidden">
<div class="progress"><div id="bar" class="bar"></div></div>
<h3 id="domanda"></h3>
<div id="opzioni"></div>
</div>

<script>

// 🔐 ADMIN EMAIL
const ADMIN_EMAIL = "domenicosenza@gmail.com";

// FIREBASE
firebase.initializeApp({
 apiKey:"AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
 authDomain:"uniai-4726b.firebaseapp.com",
 projectId:"uniai-4726b"
});

const auth = firebase.auth();
const db = firebase.firestore();

// LOGIN
function login(){
 auth.signInWithEmailAndPassword(email.value.trim(),password.value)
 .catch(e=>alert(e.message));
}
function register(){
 auth.createUserWithEmailAndPassword(email.value.trim(),password.value)
 .catch(e=>alert(e.message));
}
function logout(){auth.signOut();}

// SESSIONE
auth.onAuthStateChanged(u=>{
 if(u){
  loginBox.classList.add("hidden");
  home.classList.remove("hidden");
  user.innerText=u.email;

  // ADMIN CHECK (ANTI MAIUSCOLE)
  if(u.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()){
    adminBox.classList.remove("hidden");
  }

  caricaClassifica();

 }else{
  loginBox.classList.remove("hidden");
  home.classList.add("hidden");
 }
});

// QUIZ DATABASE
let DB = {
amm:[
{domanda:"La legge 241/1990 riguarda:",opzioni:["Procedimento amministrativo","Penale","Civile","Cost."],corretta:0},
{domanda:"Il silenzio assenso è:",opzioni:["Accoglimento","Rigetto","Sanzione","Nullità"],corretta:0}
],
cost:[
{domanda:"Costituzione entra:",opzioni:["1948","1861","1922","2001"],corretta:0}
],
eco:[
{domanda:"Il PIL misura:",opzioni:["Produzione","Debito","Inflazione","Reddito"],corretta:0}
],
trib:[
{domanda:"IVA è:",opzioni:["Indiretta","Diretta","Locale","Regionale"],corretta:0}
]
};

let quiz=[], index=0, punti=0;
let errori = JSON.parse(localStorage.getItem("errori")||"[]");

// AVVIO
function startMateria(m){
 quiz = DB[m];
 avvia();
}
function simulazione(){
 quiz = [].concat(...Object.values(DB)).sort(()=>0.5-Math.random());
 avvia();
}
function avvia(){
 index=0; punti=0;
 quizBox.classList.remove("hidden");
 home.classList.add("hidden");
 mostra();
}

function mostra(){
 if(index>=quiz.length){
  salvaScore();
  quizBox.innerHTML=`<h3>Risultato ${punti}/${quiz.length}</h3><button onclick="location.reload()">Home</button>`;
  return;
 }
 let q=quiz[index];
 domanda.innerText=q.domanda;

 let html="";
 q.opzioni.forEach((o,i)=>{
  html+=`<button onclick="rispondi(${i})">${o}</button>`;
 });
 opzioni.innerHTML=html;

 bar.style.width=((index+1)/quiz.length*100)+"%";
}

function rispondi(i){
 if(i===quiz[index].corretta) punti++;
 else{
  errori.push(quiz[index]);
  localStorage.setItem("errori",JSON.stringify(errori));
 }
 index++;
 mostra();
}

// ERRORI
function mostraErrori(){
 if(errori.length===0) return alert("Nessun errore");
 quiz=errori;
 avvia();
}

// RIPASSO
function ripasso(){
 if(errori.length===0) return alert("Nessun errore");
 quiz=errori.sort(()=>0.5-Math.random()).slice(0,10);
 avvia();
}

// CLASSIFICA
function salvaScore(){
 let u=auth.currentUser;
 if(!u) return;
 db.collection("leaderboard").doc(u.uid).set({
  email:u.email,
  punti:firebase.firestore.FieldValue.increment(punti)
 },{merge:true});
}

function caricaClassifica(){
 db.collection("leaderboard").orderBy("punti","desc").limit(10).get()
 .then(s=>{
  let html="",pos=1;
  s.forEach(d=>{
    let u=d.data();
    html+=`<p>${pos}. ${u.email} - ${u.punti}</p>`;
    pos++;
  });
  rank.innerHTML=html;
 });
}

// ADMIN
function resetClassifica(){
 db.collection("leaderboard").get().then(s=>{
  s.forEach(doc=>doc.ref.delete());
 });
 alert("Classifica resettata");
}

function aggiungiQuiz(){
 let domanda = prompt("Domanda?");
 let a = prompt("Risposta A");
 let b = prompt("Risposta B");

 DB.amm.push({
  domanda:domanda,
  opzioni:[a,b,"C","D"],
  corretta:0
 });

 alert("Quiz aggiunto (solo sessione)");
}

</script>

<!-- PAYPAL -->
<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({
 createSubscription:(d,a)=>a.subscription.create({
  plan_id:'P-89F40211XT761711BNH4KATA'
 }),
 onApprove:()=>{
  localStorage.setItem("premium","true");
  alert("Premium attivo!");
 }
}).render('#paypal-button-container');
</script>

</body>
</html>
