<!DOCTYPE html>
<html>
<head>
<title>UniSmart AI</title>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCx-0jUXU98TyetAvNE6SP2E55YwsaLJ9o",
  authDomain: "uniai-4726b.firebaseapp.com",
  projectId: "uniai-4726b",
  storageBucket: "uniai-4726b.firebasestorage.app",
  messagingSenderId: "272196411633",
  appId: "1:272196411633:web:43095d8b2217a23ad68950"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
</script>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #4f46e5, #9333ea);
  margin: 0;
  color: white;
}

.header {
  padding: 20px;
  font-size: 22px;
  font-weight: bold;
}

.container {
  padding: 20px;
}

.card {
  background: white;
  color: black;
  border-radius: 15px;
  padding: 20px;
  max-width: 500px;
  margin: auto;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  background: #4f46e5;
  color: white;
  cursor: pointer;
}

button:hover {
  background: #3730a3;
}

.hidden { display:none; }

.progress {
  height: 10px;
  background: #ddd;
  border-radius: 10px;
  margin-bottom: 10px;
}

.bar {
  height: 10px;
  background: green;
  border-radius: 10px;
}
</style>

</head>

<body>

<div class="header">🎓 UniSmart AI</div>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>Login / Registrazione</h3>

  <input id="email" placeholder="Email" style="width:100%;padding:10px;margin-bottom:10px;">
  <input id="password" type="password" placeholder="Password" style="width:100%;padding:10px;margin-bottom:10px;">

  <button onclick="register()">Registrati</button>
  <button onclick="login()">Accedi</button>
</div>

<!-- HOME -->
<div id="home" class="card hidden">
  <h2>Benvenuto <span id="user"></span></h2>

  <button onclick="startSimulazione()">🎯 Simulazione Esame</button>
  <button onclick="mostraErrori()">❌ I tuoi errori</button>
  <button onclick="ripasso()">🧠 Ripasso intelligente</button>

  <h3>🔥 Sblocca tutto a soli 7€/mese</h3>

  <!-- PAYPAL -->
  <div id="paypal-button-container"></div>
</div>

<!-- QUIZ -->
<div id="quizBox" class="card hidden">
  <div id="timer"></div>

  <div class="progress">
    <div id="bar" class="bar"></div>
  </div>

  <h3 id="domanda"></h3>
  <div id="opzioni"></div>
</div>

</div>

<script>

// ===== LOGIN =====
function register(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.createUserWithEmailAndPassword(email, password)
    .then(() => alert("Registrato"))
    .catch(err => alert(err.message));
}

function login(){
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(() => alert("Login ok"))
    .catch(err => alert(err.message));
}

// auto login
auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
    document.getElementById("user").innerText = user.email;
  }
});

// ===== DATI =====
let quizData = [];
let quizFiltrati = [];
let errori = [];

let index = 0;
let punteggio = 0;

let tempo = 2700;
let timerInterval;

let limiteFree = 10;

// ===== LOAD QUIZ =====
fetch("quiz.json")
  .then(res => res.json())
  .then(data => quizData = data);

// ===== SIMULAZIONE =====
function startSimulazione(){

  quizFiltrati = quizData.sort(()=>0.5-Math.random()).slice(0,30);

  index = 0;
  punteggio = 0;
  tempo = 2700;

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quizBox").classList.remove("hidden");

  avviaTimer();
  mostra();
}

// ===== TIMER =====
function avviaTimer(){
  aggiornaTimer();

  timerInterval = setInterval(()=>{
    tempo--;
    aggiornaTimer();

    if(tempo <= 0){
      fine();
    }
  },1000);
}

function aggiornaTimer(){
  let min = Math.floor(tempo/60);
  let sec = tempo%60;
  document.getElementById("timer").innerText = "⏱️ "+min+":"+(sec<10?"0":"")+sec;
}

// ===== DOMANDA =====
function mostra(){

  if(index >= limiteFree && !localStorage.getItem("premium")){
    document.getElementById("quizBox").innerHTML = `
      <h2>🔒 Premium</h2>
      <p>Hai raggiunto il limite gratuito</p>
    `;
    return;
  }

  let q = quizFiltrati[index];

  document.getElementById("domanda").innerText = q.domanda;

  let html = "";

  q.opzioni.forEach((op,i)=>{
    html += `<button onclick="rispondi(${i})">${op}</button>`;
  });

  document.getElementById("opzioni").innerHTML = html;

  document.getElementById("bar").style.width =
    ((index+1)/quizFiltrati.length)*100 + "%";
}

// ===== RISPOSTA =====
function rispondi(i){
  let q = quizFiltrati[index];

  if(i === q.corretta){
    punteggio++;
  } else {
    errori.push(q);

    let user = auth.currentUser;
    if(user){
      db.collection("errori").add({
        user: user.uid,
        domanda: q.domanda,
        data: new Date()
      });
    }
  }

  index++;

  if(index >= quizFiltrati.length){
    fine();
  } else {
    mostra();
  }
}

// ===== FINE =====
function fine(){
  clearInterval(timerInterval);

  document.getElementById("quizBox").innerHTML = `
    <h2>Risultato</h2>
    <p>${punteggio}/${quizFiltrati.length}</p>
    <button onclick="location.reload()">Home</button>
  `;
}

// ===== ERRORI =====
function mostraErrori(){
  alert("Funzione errori attiva (cloud)");
}

// ===== RIPASSO =====
function ripasso(){
  alert("Ripasso basato sugli errori");
}

// ===== PAYPAL =====
</script>

<script src="https://www.paypal.com/sdk/js?client-id=AWUIpwA1dAgcYeBPhVcLfsHI-cn_tWQQkmt7eoyZql6hPcG_VhZ2bAg7J8yFjP31_W5R4c_URceWWS0B&vault=true&intent=subscription"></script>

<script>
paypal.Buttons({

  style: {
    shape: 'pill',
    color: 'gold',
    layout: 'vertical',
    label: 'subscribe'
  },

  createSubscription: function(data, actions) {
    return actions.subscription.create({
      plan_id: 'P-89F40211XT761711BNH4KATA'
    });
  },

  onApprove: function(data, actions) {

    localStorage.setItem("premium", "true");
    localStorage.setItem("paypalSub", data.subscriptionID);

    alert("✅ Premium attivato!");
    location.reload();
  }

}).render('#paypal-button-container');
</script>

</body>
</html>
